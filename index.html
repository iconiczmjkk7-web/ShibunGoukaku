<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>私立文系大学への合格</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--surface:#141414;--line:#2a2a2a;--text:#f5f5f5;--sub:#a3a3a3;--accent:#60a5fa;--ink:#0a0a0a;--ok:#4ade80;--ng:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px 12px}
.wrap{max-width:640px;margin:0 auto}
main.wrap{padding:0 20px 40px}
.crumb{margin:0;font-size:13px;color:var(--accent);font-weight:700}
h1{margin:2px 0 12px;font-size:26px}
button{font:inherit;color:inherit;cursor:pointer}
.row2{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:10px;align-items:center}
.wrapr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip:disabled{color:var(--sub);opacity:.6;cursor:default}
input[type=search]{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:13px;color:var(--sub)}
ul{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px;width:100%;min-height:52px;padding:10px 4px;background:none;border:0;text-align:left}
.en{font-weight:700;font-size:18px;flex:none;min-width:0}
.tag{flex:none;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ja{color:var(--sub);font-size:15px;margin-left:auto;text-align:right}
.hide li:not(.open) .ja{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.more{padding:0 4px 14px}
.more p{margin:0 0 4px}
.exja{color:var(--sub);font-size:14px;margin:0}
.say{min-height:36px;margin:8px 8px 0 0;padding:0 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-size:13px}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.sub{margin:20px 0 0;font-size:13px;color:var(--sub)}
.btn{display:block;width:100%;min-height:54px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.btn.main{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:700}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1}
.bar i{display:block;height:4px;background:var(--accent);border-radius:2px}
.top{display:flex;align-items:center;gap:14px;margin-top:16px}
.back{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:var(--surface);font-size:18px;flex:none}
.q{text-align:center;margin:36px 0 24px}
.q b{display:block;font-size:42px;overflow-wrap:anywhere}
.opt{display:block;width:100%;min-height:56px;margin-top:12px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.ng{border-color:var(--ng);color:var(--ng)}
.fb{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.fb p{margin:0 0 4px}
.fb .ok{color:var(--ok)}.fb .ng{color:var(--ng)}
.score{font-size:72px;font-weight:700;color:var(--accent);line-height:1.1;text-align:center;margin-top:20px}
.score span{font-size:26px;color:var(--text)}
.c{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px}
.card small{display:block;font-size:12px;color:var(--sub)}
.card b{font-size:26px}
.lr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border:0}
.link{display:block;min-height:32px;padding:0;border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;text-align:left}
.link:disabled{color:var(--sub);cursor:default;font-weight:400}
.scard{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:14px;padding:18px 20px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text)}
.scard:disabled{opacity:.55;cursor:default}
.scard .st{display:flex;justify-content:space-between;align-items:baseline;width:100%}
.scard .st b{font-size:22px}
.pb{display:block;width:100%;height:4px;background:var(--line);border-radius:2px}
.pb i{display:block;height:4px;border-radius:2px}
[hidden]{display:none!important}
.q b.sent{font-size:24px;line-height:1.7}
.long .row{flex-wrap:wrap}
.long .ja{flex-basis:100%;margin-left:0;text-align:left;margin-top:2px}

/* ===== theme v2 ===== */
:root{--bg:#0b0b11;--surface:#15151f;--line:#262636;--text:#f1f1f7;--sub:#a4a4b8;--accent:#8b95ff;--ink:#0b0b11;--grad:linear-gradient(135deg,#5b6cf0,#8b5cf6)}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:radial-gradient(900px 480px at 8% -8%,rgba(91,108,240,.22),transparent 60%),radial-gradient(760px 420px at 100% 0,rgba(139,92,246,.18),transparent 55%),var(--bg);overflow-x:clip}
header{background:rgba(11,11,17,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
h1{letter-spacing:.01em}
.btn,.chip,.scard,.opt,.row,.cbtn,.day,.say,.back,.fld{transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease,filter .18s ease}
.btn{border-radius:14px}
.btn.main{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(91,108,240,.25)}
.card,.scard,.fb,.panel{background:linear-gradient(180deg,#181824,#14141e);border-radius:16px}
.opt{border-radius:14px}
.card small{display:block}
.score{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.score span{-webkit-text-fill-color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main>section:not([hidden]){animation:fadein .22s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (hover:hover){
.scard:hover:not(:disabled){transform:translateY(-2px);border-color:#44446a;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.btn:hover:not(:disabled){border-color:#4a4a78;background:#1c1c2a}
.btn.main:hover:not(:disabled){filter:brightness(1.1);background:var(--grad)}
.chip:hover:not(:disabled){border-color:#4a4a78}
.opt:hover:not(:disabled){border-color:var(--accent);background:#1c1c2a}
.row:hover{background:rgba(255,255,255,.03)}
.day:hover:not(.blank){border-color:var(--accent)}
.cbtn:hover,.back:hover{border-color:var(--accent)}
}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.calhead h2{margin:0;font-size:20px}
.cbtn{width:48px;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:26px;line-height:1}
.calbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3 .card:first-child{grid-column:1/-1}
.card b{overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:16px}
.wd{text-align:center;font-size:13px;color:var(--sub);padding:6px 0}
.day{min-height:56px;padding:5px 2px 4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;color:var(--text);min-width:0}
.day .dn{font-size:15px;font-weight:600;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:999px}
.day .dots{display:flex;gap:3px;min-height:7px;align-items:center}
.day .dots i{width:7px;height:7px;border-radius:50%;display:block}
.day .dots i.qd{background:transparent;border:1.5px solid var(--sub)}
.day small{font-size:12px;color:var(--sub);line-height:1;min-height:12px}
.day.has{background:linear-gradient(180deg,rgba(139,149,255,.18),rgba(139,92,246,.08));border-color:#3a3a66}
.day.has small{color:var(--text)}
.day.today .dn{background:var(--accent);color:var(--ink)}
.day.today{border-color:var(--accent)}
.day.sel{background:rgba(139,149,255,.26);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.blank{visibility:hidden;border:0}
.legend{font-size:13px;color:var(--sub);margin:10px 2px 0}
.panel{margin-top:18px;padding:16px;border:1px solid var(--line)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph h3{margin:0;font-size:18px}
.tg{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:12px;font-weight:700;vertical-align:middle}
.entry{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;flex:none}
.entry .sd{margin-top:8px}
.eb{flex:1;min-width:0}
.eb p{margin:2px 0;overflow-wrap:anywhere}
.et{display:flex;justify-content:space-between;gap:8px}
.ea{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip.danger{border-color:#6a2f3d;color:#ff9aa8}
.form{margin-top:12px}
.form h4{margin:0 0 8px;font-size:16px}
.lb{display:block;margin-top:12px;font-size:13px;color:var(--sub)}
.fld{display:block;width:100%;min-height:48px;margin-top:6px;padding:10px 14px;background:#101018;color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px}
.fld:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(139,149,255,.25)}
textarea.fld{resize:vertical;min-height:84px}
.errs{margin:12px 0 0;padding:10px 14px 10px 30px;border:1px solid #8a3b4c;background:#2a1519;border-radius:12px;color:#ffb4c0;font-size:14px}
.fa{display:flex;gap:10px;margin-top:6px}
.fa .btn{margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:#22223a;border:1px solid #3a3a66;color:var(--text);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#3a1c24;border-color:#8a3b4c}
@media (pointer:coarse){.chip{min-height:44px}.say{min-height:44px}.back{width:48px;height:48px}.link{min-height:44px}}
@media (max-width:420px){h1{font-size:24px}header{padding:12px 14px 10px}main.wrap{padding:0 14px 40px}.q b{font-size:34px}.day{min-height:52px}.day .dn{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>
</div></header>
<div id="toast" role="status" aria-live="polite"></div>
<main class="wrap">

<section id="v-stats" hidden></section>
</main>

function right(w){return w.kind==="keigo"?w.pos:w.kind==="read"?w.r:w.kind==="write"||w.kind==="term"?w.ko:w.ja}
function options(w){
  if(w.kind==="keigo")return["尊敬語","謙譲語","丁寧語"];
  if(w.kind==="read")return shuffle([w.r].concat(w.rd.slice(0,3)));

  if(w.kind==="term"){var tp=src().filter(function(x){return x.en!==w.en&&x.pos===w.pos});if(tp.length<3)tp=ALL.filter(function(x){return x.cat===st.cat&&x.en!==w.en});var td=[];shuffle(tp).forEach(function(x){if(td.length<3&&td.indexOf(x.ko)<0)td.push(x.ko)});return shuffle(td.concat([w.ko]))}
  var pool=src().filter(function(x){return x.en!==w.en&&x.ja!==w.ja&&x.pos===w.pos});
  if(pool.length<3)pool=ALL.filter(function(x){return x.cat===st.cat&&x.en!==w.en&&x.ja!==w.ja});
  var d=[];shuffle(pool).forEach(function(x){if(d.length<3&&d.indexOf(x.ja)<0)d.push(x.ja)});

  rd.picked=i;var good=rd.opts[i]===right(w),s=P.w[w.en]||{b:0,d:0,c:0,x:0};

function streak(){

  if(!set[ymd(d)])d.setDate(d.getDate()-1);
  while(set[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n;
}
