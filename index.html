<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--surface:#141414;--line:#2a2a2a;--text:#f5f5f5;--sub:#a3a3a3;--accent:#60a5fa;--ink:#0a0a0a;--ok:#4ade80;--ng:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans',sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px 12px}
.wrap{max-width:640px;margin:0 auto}
main.wrap{padding:0 20px 40px}
.crumb{margin:0;font-size:13px;color:var(--accent);font-weight:700}
h1{margin:2px 0 12px;font-size:26px}
button{font:inherit;color:inherit;cursor:pointer}
.row2{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:10px;align-items:center}
.wrapr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true],.chip[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
.chip:disabled{color:var(--sub);opacity:.6;cursor:default}
input[type=search]{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:13px;color:var(--sub)}
ul{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px;width:100%;min-height:52px;padding:10px 4px;background:none;border:0;text-align:left}
.en{font-weight:700;font-size:18px;flex:none;min-width:0}
.tag{flex:none;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ja{color:var(--sub);font-size:15px;margin-left:auto;text-align:right}
.hide li:not(.open) .ja{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.more{padding:0 4px 14px}
.more p{margin:0 0 4px}
.exja{color:var(--sub);font-size:14px;margin:0}
.say{min-height:36px;margin:8px 8px 0 0;padding:0 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-size:13px}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.sub{margin:20px 0 0;font-size:13px;color:var(--sub)}
.btn{display:block;width:100%;min-height:54px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.btn.main{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:700}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1}
.bar i{display:block;height:4px;background:var(--accent);border-radius:2px}
.top{display:flex;align-items:center;gap:14px;margin-top:16px}
.back{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:var(--surface);font-size:18px;flex:none}
.q{text-align:center;margin:36px 0 24px}
.q b{display:block;font-size:42px;overflow-wrap:anywhere}
.opt{display:block;width:100%;min-height:56px;margin-top:12px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px}
.opt:disabled{cursor:default;color:var(--text)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.ng{border-color:var(--ng);color:var(--ng)}
.fb{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.fb p{margin:0 0 4px}
.fb .ok{color:var(--ok)}.fb .ng{color:var(--ng)}
.score{font-size:72px;font-weight:700;color:var(--accent);line-height:1.1;text-align:center;margin-top:20px}
.score span{font-size:26px;color:var(--text)}
.c{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px}
.card small{display:block;font-size:12px;color:var(--sub)}
.card b{font-size:26px}
.lr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border:0}
.link{display:block;min-height:32px;padding:0;border:0;background:none;color:var(--accent);font-size:13px;font-weight:700;text-align:left}
.link:disabled{color:var(--sub);cursor:default;font-weight:400}
.scard{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:14px;padding:18px 20px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--text)}
.scard:disabled{opacity:.55;cursor:default}
.scard .st{display:flex;justify-content:space-between;align-items:baseline;width:100%}
.scard .st b{font-size:22px}
.pb{display:block;width:100%;height:4px;background:var(--line);border-radius:2px}
.pb i{display:block;height:4px;border-radius:2px}
[hidden]{display:none!important}
.q b.sent{font-size:24px;line-height:1.7}
</style>
</head>
<body>
<header><div class="wrap">
<button class="link" id="crumb" data-act="up"></button><h1 id="ttl">単語</h1>
<div class="row2" id="cats" aria-label="分野"></div>
<div class="row2" id="nav" role="tablist" aria-label="画面"></div>
<div id="listctl">
<div class="row2" style="overflow:visible"><input type="search" id="q" placeholder="単語・意味で検索" aria-label="単語を検索"></div>
<div class="row2" id="levels" role="tablist" aria-label="レベル"></div>
<div class="row2" id="pos" aria-label="品詞"></div>
</div>
</div></header>
<main class="wrap">
<input type="file" id="imp" accept=".json,application/json" hidden>
<section id="v-home" hidden></section>
<section id="v-subject" hidden></section>
<section id="v-list" hidden><div class="meta"><span id="count"></span><button class="chip" id="hide" aria-pressed="false">意味を隠す</button></div><ul id="list"></ul></section>
<section id="v-quiz" hidden></section>
<section id="v-stats" hidden></section>
</main>

function src(){return ALL.filter(function(w){return w.cat===st.cat&&(qz.lv==="all"||w.lv===qz.lv)&&(st.cat!=="kanji"||qz.kind==="mix"||w.kind===qz.kind)})}
function dueList(){var now=Date.now();return src().filter(function(w){var s=P.w[w.en];return s&&s.d<=now})}
function build(){
  var now=Date.now(),due=[],nw=[],rest=[];
  src().forEach(function(w){var s=P.w[w.en];if(!s)nw.push(w);else if(s.d<=now)due.push(w);else rest.push(w)});
  var l=qz.mode==="review"?shuffle(due):shuffle(due).concat(shuffle(nw),shuffle(rest));
  return l.slice(0,qz.n);
}
function right(w){return w.kind==="keigo"?w.pos:w.kind==="read"?w.r:w.kind==="write"?w.ko:w.ja}
function options(w){
  if(w.kind==="keigo")return["尊敬語","謙譲語","丁寧語"];
  if(w.kind==="read")return shuffle([w.r].concat(w.rd.slice(0,3)));
  if(w.kind==="write")return shuffle([w.ko].concat(w.kd.slice(0,3)));
  var pool=src().filter(function(x){return x.en!==w.en&&x.ja!==w.ja&&x.pos===w.pos});
  if(pool.length<3)pool=ALL.filter(function(x){return x.cat===st.cat&&x.en!==w.en&&x.ja!==w.ja});
  var d=[];shuffle(pool).forEach(function(x){if(d.length<3&&d.indexOf(x.ja)<0)d.push(x.ja)});
  return shuffle(d.concat([w.ja]));
}
function begin(list){if(!list.length)return;rd={list:list,i:0,ok:0,miss:[],picked:null,opts:options(list[0])}}
function answer(i){
  var w=rd.list[rd.i];if(rd.picked!=null)return;
  rd.picked=i;var good=rd.opts[i]===right(w),s=P.w[w.en]||{b:0,d:0,c:0,x:0};
  if(good){s.b=Math.min(s.b+1,5);s.d=Date.now()+IV[s.b]*864e5;s.c++;rd.ok++}else{s.b=0;s.d=Date.now();s.x++;rd.miss.push(w)}
  s.t=Date.now();P.w[w.en]=s;P.tot++;if(good)P.ok++;
  var t=ymd(new Date());if(P.days.indexOf(t)<0)P.days.push(t);
  save();
}
function next(){rd.i++;rd.picked=null;if(rd.i<rd.list.length)rd.opts=options(rd.list[rd.i]);window.scrollTo(0,0)}

function streak(){
  var set={};P.days.forEach(function(d){set[d]=1});var d=new Date(),n=0;
  if(!set[ymd(d)])d.setDate(d.getDate()-1);
  while(set[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n;
}

document.addEventListener("click",function(e){

  if(d.say){say(d.say);return}
  if(d.act==="sync"){clearTimeout(SY.t);push();return}

  if(d.act==="import"){$("imp").click();return}
  if(d.subj){st.subj=d.subj;st.screen="subject";render();window.scrollTo(0,0);return}
  if(d.go){st.cat=d.go;st.lv=cat().lvs[0][0];st.pos="all";st.q="";$("q").value="";qz.lv="all";rd=null;st.screen="study";st.view="quiz";st.back="";render();window.scrollTo(0,0);return}
  if(d.act==="stats"){st.screen="study";st.view="stats";st.back="home";render();window.scrollTo(0,0);return}
  if(d.act==="up"){rd=null;if(st.screen==="study")st.screen=st.back==="home"?"home":"subject";else st.screen="home";render();window.scrollTo(0,0);return}

  if(d.act==="start"){begin(build());render();window.scrollTo(0,0);return}
  if(d.act==="next"){next();render();return}
  if(d.act==="retry"){begin(shuffle(rd.miss));render();window.scrollTo(0,0);return}
  if(d.act==="quit"){rd=null;render();return}
  if(d.act==="reset"){if(!rs){rs=true;renderStats();setTimeout(function(){rs=false;if(st.view==="stats")renderStats()},4000)}else{P=fresh();P.r=Date.now();save();rs=false;renderStats()}return}
  if(b.classList.contains("row")){var li=b.parentNode,m=li.querySelector(".more"),o=m.hidden;m.hidden=!o;li.classList.toggle("open",o);b.setAttribute("aria-expanded",o)}
});

var SY={on:false,msg:"確認中…",ref:null,t:null,busy:false,again:false,first:false};
function syncText(){return SY.on?"同期:オン("+SY.msg+")":"同期:オフ("+SY.msg+")"}
function hhmm(){var d=new Date();return("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function refreshStats(){if(st.screen==="study"&&st.view==="stats")renderStats()}
function pack(p){var rows=[];Object.keys(p.w).forEach(function(k){var s=p.w[k];rows.push([k,s.b,s.d,s.c,s.x,s.t||0])});return{v:2,rows:JSON.stringify(rows),days:p.days,tot:p.tot,ok:p.ok,r:p.r||0,u:Date.now()}}
function unpack(d){var o=fresh();try{JSON.parse(d.rows||"[]").forEach(function(r){o.w[r[0]]={b:r[1],d:r[2],c:r[3],x:r[4],t:r[5]}})}catch(e){}o.days=d.days||[];o.tot=d.tot||0;o.ok=d.ok||0;o.r=d.r||0;return o}
function mergeP(a,b){
  var R=Math.max(a.r||0,b.r||0),o=fresh(),keys={};o.r=R;
  Object.keys(a.w).forEach(function(k){keys[k]=1});Object.keys(b.w).forEach(function(k){keys[k]=1});
  Object.keys(keys).sort().forEach(function(k){
    var x=a.w[k],y=b.w[k],s;
    if(!x)s=y;else if(!y)s=x;else if((x.t||0)!==(y.t||0))s=(x.t||0)>(y.t||0)?x:y;else s=(x.c+x.x)>=(y.c+y.x)?x:y;
    if(R&&(s.t||0)<=R)return;
    o.w[k]=s;o.tot+=s.c+s.x;o.ok+=s.c;
  });
  var dm={},rd0=R?ymd(new Date(R)):"";
  (a.days||[]).concat(b.days||[]).forEach(function(d){if(!R||d>=rd0)dm[d]=1});
  o.days=Object.keys(dm).sort();return o;
}
function sfail(e){
  if(e&&e.code==="invalid_argument"){SY.on=false;if(SY.u)SY.u();SY.msg="この表示では保存できません(閲覧のみの権限)"}
  else SY.msg="同期に失敗しました。あとでもう一度試してください";
}
function push(){
  if(!SY.on)return Promise.resolve();
  if(SY.busy){SY.again=true;return Promise.resolve()}
  SY.busy=true;
  return SY.ref.set(pack(P)).then(function(){SY.msg=hhmm()+"に同期"}).catch(sfail).then(function(){SY.busy=false;refreshStats();if(SY.again){SY.again=false;return push()}});
}

    var user=r[0],db=r[1];
    if(!user||!db){SY.msg="claude.aiにログインして開くと使えます";refreshStats();return}
    return user.id().then(function(id){
      if(!id){SY.msg="アカウント情報を取得できません";refreshStats();return}
      SY.ref=db.collection("data/users/"+id).doc("progress");SY.on=true;SY.msg="接続中";
      SY.u=SY.ref.onSnapshot(function(s){
        if(s.metadata&&s.metadata.hasPendingWrites)return;
        var rem=s.exists?unpack(s.data()):fresh(),m=mergeP(P,rem),changed=JSON.stringify(m)!==JSON.stringify(P),needPush=JSON.stringify(m)!==JSON.stringify(rem);
        if(changed){P=m;persist()}
        if(!SY.first){SY.first=true;SY.msg="接続済み";if(needPush)setTimeout(push,300)}
        if(changed&&!rd)render();else refreshStats();
      },function(e){sfail(e);refreshStats()});
    });
  }).catch(function(){SY.msg="同期を利用できません";refreshStats()});
}

});
